# Shared settings for data prep, training, evaluation and export.
# model_id must match an entry in models.yaml; export writes to artifacts/models/<model_id>/.
model_id: cervical-cytology
seed: 42
classes: [ASCUS, HSIL, LSIL, NILM, SCC]

data:
  raw_dir: data/raw
  splits_dir: data/splits
  val_frac: 0.15
  test_frac: 0.15
  dedupe_hash_distance: 2   # perceptual-hash Hamming distance treated as duplicate

image_size: 224
num_workers: 4
artifacts_dir: artifacts

models:
  scratch:
    arch: scratch_cnn
    epochs: 100
    batch_size: 48
    lr: 0.002
    weight_decay: 0.05
    warmup_epochs: 3
    patience: 15
  pretrained:
    arch: efficientnet_b0
    epochs: 30
    batch_size: 48
    lr: 0.0005
    weight_decay: 0.01
    warmup_epochs: 1
    freeze_epochs: 2
    patience: 8

label_smoothing: 0.1
